[versions]
managed-bson = "5.7.0"
# Keep aligned with tools.jackson.core from the Micronaut platform (jackson-bom).
# Bump when the platform Jackson line moves; do not jump major without testing.
managed-jackson-dataformat-cbor = "3.1.4"
managed-jakarta-json-api = "2.1.3"
managed-jakarta-json-bindApi = "3.0.2"
managed-jakarta-xml-bindApi = "4.0.5"
jaxb-runtime = "4.0.9"
managed-eclipse-parsson = "1.1.9"

aws-lambda-events = "3.16.1"
aws-lambda-serialization = "1.4.1"
microstream-storage-restclient = "08.01.02-MS-GA"
oracle-jdbc-driver = "23.26.3.0.0"
jetbrains-annotations = "26.1.0"
jmh = "1.37"
lombok = "1.18.46"
errorprone-gradle-plugin = "5.1.1"
nullaway = "0.13.8"
error_prone_core = "2.49.0"
woodstox = "7.1.1"

micronaut-platform = "5.0.2"
micronaut = "5.1.3"
micronaut-discovery = "5.0.0"
micronaut-oracle-cloud = "6.0.0"
micronaut-reactor = "4.0.0"
micronaut-validation = "5.0.0"
micronaut-gradle-plugin = "5.0.0"
micronaut-sourcegen = "2.0.0"
jsonassert = "1.5.3"
xmlunit = "2.12.0"

# Dependencies used only by Jakarta TCK verification tasks.
jakarta-enterprise-cdi-api = "4.0.1"
jakarta-json-tck = "2.1.1"
jakarta-json-bind-tck = "3.0.2"
jakarta-tck-sigtest = "2.6"
weld-se = "5.1.7.Final"

[libraries]
# Micronaut
micronaut-core = { module = "io.micronaut:micronaut-core-bom", version.ref = "micronaut" }
micronaut-platform = { module = "io.micronaut.platform:micronaut-platform", version.ref = "micronaut-platform"}
micronaut-oracle-cloud = { module = 'io.micronaut.oraclecloud:micronaut-oraclecloud-bom', version.ref = 'micronaut-oracle-cloud' }
micronaut-reactor = { module = "io.micronaut.reactor:micronaut-reactor-bom", version.ref = "micronaut-reactor" }
micronaut-validation = { module = "io.micronaut.validation:micronaut-validation-bom", version.ref = "micronaut-validation" }
micronaut-discovery = { module = "io.micronaut.discovery:micronaut-discovery-client", version.ref = "micronaut-discovery" }
micronaut-sourcegen-generator-java = { module = "io.micronaut.sourcegen:micronaut-sourcegen-generator-java", version.ref = "micronaut-sourcegen" }
micronaut-sourcegen-generator = { module = "io.micronaut.sourcegen:micronaut-sourcegen-generator", version.ref = "micronaut-sourcegen" }
micronaut-sourcegen-model = { module = "io.micronaut.sourcegen:micronaut-sourcegen-model", version.ref = "micronaut-sourcegen" }

managed-bson = { module = "org.mongodb:bson", version.ref = "managed-bson" }
managed-jackson-dataformat-cbor = { module = "tools.jackson.dataformat:jackson-dataformat-cbor", version.ref = "managed-jackson-dataformat-cbor" }
managed-eclipse-parsson = { module = "org.eclipse.parsson:parsson", version.ref = "managed-eclipse-parsson" }
managed-jakarta-json-api = { module = "jakarta.json:jakarta.json-api", version.ref = "managed-jakarta-json-api" }
managed-jakarta-json-bindApi = { module = "jakarta.json.bind:jakarta.json.bind-api", version.ref = "managed-jakarta-json-bindApi" }
managed-jakarta-xml-bindApi = { module = "jakarta.xml.bind:jakarta.xml.bind-api", version.ref = "managed-jakarta-xml-bindApi" }
jaxb-runtime = { module = "org.glassfish.jaxb:jaxb-runtime", version.ref = "jaxb-runtime" }

# Dependencies used only by Jakarta TCK verification tasks.
jakarta-enterprise-cdi-api = { module = "jakarta.enterprise:jakarta.enterprise.cdi-api", version.ref = "jakarta-enterprise-cdi-api" }
jakarta-json-tck = { module = "jakarta.json:jakarta.json-tck-tests", version.ref = "jakarta-json-tck" }
jakarta-json-bind-tck = { module = "jakarta.json.bind:jakarta.json.bind-tck", version.ref = "jakarta-json-bind-tck" }
jakarta-tck-sigtest = { module = "jakarta.tck:sigtest-maven-plugin", version.ref = "jakarta-tck-sigtest" }
weld-se-core = { module = "org.jboss.weld.se:weld-se-core", version.ref = "weld-se" }

oracle-jdbc-driver = { module = "com.oracle.database.jdbc:ojdbc8", version.ref = "oracle-jdbc-driver" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
aws-lambda-events = { module = "com.amazonaws:aws-lambda-java-events", version.ref = "aws-lambda-events" }
aws-lambda-serialization = { module = "com.amazonaws:aws-lambda-java-serialization", version.ref = "aws-lambda-serialization" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

microstream-storage-restclient = { module = "one.microstream:microstream-storage-restclient", version.ref = "microstream-storage-restclient" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-platform-engine = { module = "org.junit.platform:junit-platform-suite-engine" }

jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
jackson-module-blackbird = { module = "tools.jackson.module:jackson-module-blackbird" }
woodstox-core = { module = "com.fasterxml.woodstox:woodstox-core", version.ref = "woodstox" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
error-prone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "error_prone_core" }

oci-aidocument = { module = "com.oracle.oci.sdk:oci-java-sdk-aidocument" }
jsonassert = { module = 'org.skyscreamer:jsonassert', version.ref = 'jsonassert'}
xmlunit-core = { module = "org.xmlunit:xmlunit-core", version.ref = "xmlunit" }

#PLUGINS
gradle-micronaut = { module = "io.micronaut.gradle:micronaut-gradle-plugin", version.ref = "micronaut-gradle-plugin" }
gradle-errorprone = { module = "net.ltgt.errorprone:net.ltgt.errorprone.gradle.plugin", version.ref = "errorprone-gradle-plugin"}

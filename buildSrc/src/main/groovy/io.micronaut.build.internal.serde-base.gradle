repositories {
    mavenCentral()
    // the snapshot of Micronaut Core with JsonMapper.createStreamWriter, until Core 5.3 is released
    maven {
        url = 'https://central.sonatype.com/repository/maven-snapshots/'
        mavenContent {
            snapshotsOnly()
        }
    }
}

configurations.configureEach {
    resolutionStrategy {
        preferProjectModules()
        eachDependency {
            if (requested.group == "io.micronaut.sourcegen") {
                useVersion(libs.versions.micronaut.sourcegen.get())
                because("Micronaut Serialization requires a newer SourceGen version than the imported Micronaut Core BOM")
            }
        }
    }
}

plugins {
    id("io.micronaut.build.internal.serde-base")
    id("java-library")
    id("io.micronaut.build.internal.python")
}

dependencies {
    implementation(platform(mn.micronaut.core.bom))
    // The Python compiler takes the compile classpath as its annotation processor path,
    // so the serde processor is a regular (not annotationProcessor) dependency.
    implementation(projects.micronautSerdeProcessor)
    implementation(mn.micronaut.inject.python)
    implementation(mn.micronaut.context.python)
    implementation(mn.micronaut.runtime)

    testImplementation(mn.micronaut.inject.python.test)
    testImplementation(mnTest.micronaut.test.junit5)
    testRuntimeOnly(mnLogging.logback.classic)
    testRuntimeOnly(mnTest.junit.jupiter.engine)
    testRuntimeOnly(libs.junit.platform.launcher)
}

// TODO(python): pin the source generator the Python compiler runs with to the version micronaut-core
// itself requests (2.1.0). With micronaut-sourcegen 2.2.0/2.2.1 the `$PythonFunctionalInterfaces$<hash>`
// class that core 5.2.4 generates for the Python functional-interface registry is written as
// `List.of(new Object[]{...})` as soon as a module has more than ten Python-visible functional interfaces
// (`List.of` has explicit overloads only up to ten arguments), which does not compile:
// "incompatible types: inference variable E has incompatible bounds ... lower bounds: java.lang.Object".
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "io.micronaut.sourcegen") {
            details.useVersion("2.1.0")
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty("micronaut.python.pool.enabled", "false")
}

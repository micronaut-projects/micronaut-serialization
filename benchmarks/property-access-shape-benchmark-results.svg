    <text class="row-label" x="72" y="58">Jackson Databind</text>
    <rect class="jackson" x="300" y="44" width="473.6" height="16" rx="3"/>
    <text class="value" x="781.6" y="58">894</text>
    <text class="row-label" x="72" y="80">Jackson Databind Blackbird</text>
    <rect class="blackbird" x="300" y="66" width="414.7" height="16" rx="3"/>
    <text class="value" x="722.7" y="80">782</text>
    <text class="row-label" x="72" y="102">Serde generated</text>
    <rect class="serde-generated" x="300" y="88" width="297.0" height="16" rx="3"/>
    <text class="value" x="605.0" y="102">560</text>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="992" viewBox="0 0 1260 992" role="img" aria-labelledby="title desc">
  <title id="title">PropertyAccessShapeBenchmark local results</title>
  <desc id="desc">Local JMH benchmark results comparing Jackson Databind, Jackson Databind Blackbird, generated Micronaut Serialization, and runtime Micronaut Serialization.</desc>
  <style>
    .bg { fill: #ffffff; }
    .title { font: 700 24px Arial, Helvetica, sans-serif; fill: #1f2937; }
    .subtitle { font: 400 13px Arial, Helvetica, sans-serif; fill: #4b5563; }
    .panel-title { font: 700 17px Arial, Helvetica, sans-serif; fill: #111827; }
    .subtle { font: 400 12px Arial, Helvetica, sans-serif; fill: #6b7280; }
    .label { font: 400 12px Arial, Helvetica, sans-serif; fill: #374151; }
    .value { font: 700 11px Arial, Helvetica, sans-serif; fill: #111827; }
    .tick { font: 400 11px Arial, Helvetica, sans-serif; fill: #6b7280; }
    .legend { font: 400 12px Arial, Helvetica, sans-serif; fill: #374151; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
  </style>
  <rect class="bg" x="0" y="0" width="1260" height="992"/>
  <text x="32" y="34" class="title">PropertyAccessShapeBenchmark local results</text>
  <text x="32" y="56" class="subtitle">GraalVM Java 25, 3 forks, 5 warmup iterations, 5 measurement iterations, 1-second iterations, -prof gc</text>
<rect x="32" y="75" width="13" height="13" fill="#4E79A7" rx="2"/>
<text x="52" y="86" class="legend">Jackson Databind</text>

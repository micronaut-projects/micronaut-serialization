    <rect x="300" y="50" width="287.8" height="14" rx="3" fill="#F28E2B"/>
    <text class="value" x="595.8" y="61">514 ns/op</text>
    <text class="label" x="132" y="83">Serde Jackson generated</text>
    <rect x="300" y="72" width="154.2" height="14" rx="3" fill="#59A14F"/>
    <text class="value" x="462.2" y="83">275 ns/op</text>

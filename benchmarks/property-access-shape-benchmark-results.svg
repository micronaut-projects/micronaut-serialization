    <rect class="serde-generated" x="300" y="88" width="195.6" height="16" rx="3"/>
    <text class="value" x="503.6" y="102">277</text>
    <text class="row-label" x="72" y="124">Serde runtime</text>
    <rect class="serde-runtime" x="300" y="110" width="231.7" height="16" rx="3"/>
    <text class="value" x="539.7" y="124">328</text>

    <text class="shape-label" x="40" y="144">Getter/setter</text>
    <text class="row-label" x="72" y="168">Jackson Databind</text>
    <rect class="jackson" x="300" y="154" width="252.2" height="16" rx="3"/>
    <text class="value" x="560.2" y="168">357</text>
    <text class="row-label" x="72" y="190">Jackson Databind Blackbird</text>
    <rect class="blackbird" x="300" y="176" width="241.1" height="16" rx="3"/>
    <text class="value" x="549.1" y="190">341</text>
    <text class="row-label" x="72" y="212">Serde generated</text>
    <rect class="serde-generated" x="300" y="198" width="195.6" height="16" rx="3"/>
    <text class="value" x="503.6" y="212">277</text>
    <text class="row-label" x="72" y="234">Serde runtime</text>
    <rect class="serde-runtime" x="300" y="220" width="204.5" height="16" rx="3"/>
    <text class="value" x="512.5" y="234">289</text>

    <text class="shape-label" x="40" y="254">Field</text>
    <text class="row-label" x="72" y="278">Jackson Databind</text>
    <rect class="jackson" x="300" y="264" width="249.2" height="16" rx="3"/>
    <text class="value" x="557.2" y="278">353</text>
    <text class="row-label" x="72" y="300">Jackson Databind Blackbird</text>
    <rect class="blackbird" x="300" y="286" width="247.3" height="16" rx="3"/>
    <text class="value" x="555.3" y="300">350</text>
    <text class="row-label" x="72" y="322">Serde generated</text>
    <rect class="serde-generated" x="300" y="308" width="196.3" height="16" rx="3"/>
    <text class="value" x="504.3" y="322">278</text>
    <text class="row-label" x="72" y="344">Serde runtime</text>
    <rect class="serde-runtime" x="300" y="330" width="203.4" height="16" rx="3"/>
    <text class="value" x="511.4" y="344">288</text>

  </g>

  <g transform="translate(0 896)">
    <text class="panel-title" x="40" y="0">Round-trip average time (ns/op, lower is better)</text>
    <line class="grid" x1="300" y1="30" x2="300" y2="354"/>
    <line class="grid" x1="565" y1="30" x2="565" y2="354"/>
    <line class="grid" x1="830" y1="30" x2="830" y2="354"/>
    <line class="baseline" x1="300" y1="354" x2="830" y2="354"/>
    <text class="axis" x="300" y="374" text-anchor="middle">0</text>
    <text class="axis" x="565" y="374" text-anchor="middle">500</text>

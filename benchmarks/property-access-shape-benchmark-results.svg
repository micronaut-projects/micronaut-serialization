<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1260" viewBox="0 0 980 1260" role="img" aria-labelledby="title desc">
  <title id="title">PropertyAccessShapeBenchmark local results</title>
  <desc id="desc">Local JMH benchmark results comparing constructor-bound, getter/setter, and field property binding across Jackson Databind, Jackson Databind Blackbird, Micronaut Serialization generated serdes, and Micronaut Serialization runtime serdes.</desc>
  <style>
    .background { fill: #ffffff; }
    .title { fill: #111827; font: 700 24px Arial, Helvetica, sans-serif; }
    .subtitle { fill: #4b5563; font: 400 13px Arial, Helvetica, sans-serif; }
    .panel-title { fill: #111827; font: 700 16px Arial, Helvetica, sans-serif; }
    .shape-label { fill: #111827; font: 700 13px Arial, Helvetica, sans-serif; }
    .row-label { fill: #374151; font: 400 12px Arial, Helvetica, sans-serif; }
    .value { fill: #111827; font: 700 12px Arial, Helvetica, sans-serif; }
    .axis { fill: #6b7280; font: 400 11px Arial, Helvetica, sans-serif; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .baseline { stroke: #9ca3af; stroke-width: 1; }
    .jackson { fill: #4e79a7; }
    .blackbird { fill: #f28e2b; }
    .serde-generated { fill: #59a14f; }
    .serde-runtime { fill: #e15759; }
  </style>

  <rect class="background" width="980" height="1260"/>
  <text class="title" x="40" y="36">PropertyAccessShapeBenchmark local results</text>
  <text class="subtitle" x="40" y="60">JDK 25, 1 fork, 5 warmup iterations, 5 measurement iterations, 1-second iterations, -prof gc</text>

  <g transform="translate(0 104)">
    <text class="panel-title" x="40" y="0">Serialization throughput (ops/s, higher is better)</text>
    <line class="grid" x1="300" y1="30" x2="300" y2="354"/>
    <line class="grid" x1="565" y1="30" x2="565" y2="354"/>
    <line class="grid" x1="830" y1="30" x2="830" y2="354"/>
    <line class="baseline" x1="300" y1="354" x2="830" y2="354"/>
    <text class="axis" x="300" y="374" text-anchor="middle">0</text>
    <text class="axis" x="565" y="374" text-anchor="middle">2.25M</text>
    <text class="axis" x="830" y="374" text-anchor="middle">4.5M</text>

    <text class="shape-label" x="40" y="34">Constructor</text>
    <text class="row-label" x="72" y="58">Jackson Databind</text>
    <rect class="jackson" x="300" y="44" width="377.3" height="16" rx="3"/>
    <text class="value" x="685.3" y="58">3,203,461</text>
    <text class="row-label" x="72" y="80">Jackson Databind Blackbird</text>
    <rect class="blackbird" x="300" y="66" width="432.7" height="16" rx="3"/>
    <text class="value" x="740.7" y="80">3,674,138</text>
    <text class="row-label" x="72" y="102">Serde generated</text>
    <rect class="serde-generated" x="300" y="88" width="476.7" height="16" rx="3"/>
    <text class="value" x="784.7" y="102">4,047,163</text>
    <text class="row-label" x="72" y="124">Serde runtime</text>
    <rect class="serde-runtime" x="300" y="110" width="418.1" height="16" rx="3"/>
    <text class="value" x="726.1" y="124">3,550,170</text>

    <text class="shape-label" x="40" y="144">Getter/setter</text>
    <text class="row-label" x="72" y="168">Jackson Databind</text>
    <rect class="jackson" x="300" y="154" width="374.0" height="16" rx="3"/>
    <text class="value" x="682.0" y="168">3,175,818</text>
    <text class="row-label" x="72" y="190">Jackson Databind Blackbird</text>
    <rect class="blackbird" x="300" y="176" width="434.3" height="16" rx="3"/>
    <text class="value" x="742.3" y="190">3,687,172</text>
    <text class="row-label" x="72" y="212">Serde generated</text>
    <rect class="serde-generated" x="300" y="198" width="471.4" height="16" rx="3"/>
    <text class="value" x="779.4" y="212">4,002,236</text>
    <text class="row-label" x="72" y="234">Serde runtime</text>
    <rect class="serde-runtime" x="300" y="220" width="410.9" height="16" rx="3"/>
    <text class="value" x="718.9" y="234">3,488,861</text>

    <text class="shape-label" x="40" y="254">Field</text>
    <text class="row-label" x="72" y="278">Jackson Databind</text>
    <rect class="jackson" x="300" y="264" width="374.5" height="16" rx="3"/>
    <text class="value" x="682.5" y="278">3,179,924</text>
    <text class="row-label" x="72" y="300">Jackson Databind Blackbird</text>
    <rect class="blackbird" x="300" y="286" width="375.5" height="16" rx="3"/>
    <text class="value" x="683.5" y="300">3,188,136</text>
    <text class="row-label" x="72" y="322">Serde generated</text>
    <rect class="serde-generated" x="300" y="308" width="464.7" height="16" rx="3"/>
    <text class="value" x="772.7" y="322">3,945,190</text>
    <text class="row-label" x="72" y="344">Serde runtime</text>
    <rect class="serde-runtime" x="300" y="330" width="415.5" height="16" rx="3"/>
    <text class="value" x="723.5" y="344">3,528,218</text>

  </g>


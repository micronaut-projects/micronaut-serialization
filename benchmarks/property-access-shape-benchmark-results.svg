  </g>

  <text class="subtitle" x="40" y="1212">Source: full-release-final-2026-05-20.json</text>
  <text class="subtitle" x="40" y="1232">Throughput uses ops/s; average-time results use ns/op. Longer bars are faster only in the throughput chart.</text>
</svg>

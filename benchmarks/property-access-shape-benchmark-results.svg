<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1260" viewBox="0 0 1040 1260" role="img" aria-labelledby="title desc">
  <title id="title">PropertyAccessShapeBenchmark local results</title>
  <desc id="desc">Local JMH benchmark results comparing constructor-bound, getter/setter, and field property binding across Jackson Databind, Jackson Databind Blackbird, Micronaut Serialization generated serdes, and Micronaut Serialization runtime serdes.</desc>
  <style>text{font-family:Inter,Arial,sans-serif;fill:#1f2933}.title{font-size:24px;font-weight:700}.panel-title{font-size:15px;font-weight:700}.shape{font-size:13px;font-weight:700}.label{font-size:12px}.value{font-size:11px;fill:#374151}.axis{font-size:11px;fill:#6b7280}.grid{stroke:#e5e7eb;stroke-width:1}.axis-line{stroke:#9ca3af;stroke-width:1}</style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text class="title" x="40" y="36">PropertyAccessShapeBenchmark local results</text>
  <g transform="translate(0 70)">
    <text class="panel-title" x="40" y="0">Serialization throughput (ops/s, higher is better)</text>
    <line class="grid" x1="300.0" y1="18" x2="300.0" y2="326"/>
    <text class="axis" x="300.0" y="346" text-anchor="middle">0</text>
    <line class="grid" x1="580.0" y1="18" x2="580.0" y2="326"/>
    <text class="axis" x="580.0" y="346" text-anchor="middle">2,500,000</text>
    <line class="grid" x1="860.0" y1="18" x2="860.0" y2="326"/>
    <text class="axis" x="860.0" y="346" text-anchor="middle">5,000,000</text>
    <line class="axis-line" x1="300" y1="326" x2="860" y2="326"/>
    <text class="shape" x="40" y="40">Constructor</text>
    <text class="label" x="132" y="39">Jackson Databind</text>
    <rect x="300" y="28" width="357.1" height="14" rx="3" fill="#4E79A7"/>
    <text class="value" x="665.1" y="39">3,188,619 ops/s</text>
    <text class="label" x="132" y="61">Jackson Databind Blackbird</text>
    <rect x="300" y="50" width="428.9" height="14" rx="3" fill="#F28E2B"/>
    <text class="value" x="736.9" y="61">3,829,079 ops/s</text>
    <text class="label" x="132" y="83">Serde Jackson generated</text>
    <rect x="300" y="72" width="454.1" height="14" rx="3" fill="#59A14F"/>
    <text class="value" x="762.1" y="83">4,054,852 ops/s</text>
    <text class="label" x="132" y="105">Serde Jackson runtime</text>
    <rect x="300" y="94" width="404.5" height="14" rx="3" fill="#E15759"/>
    <text class="value" x="712.5" y="105">3,611,368 ops/s</text>
    <text class="shape" x="40" y="146">Getter/setter</text>
    <text class="label" x="132" y="145">Jackson Databind</text>
    <rect x="300" y="134" width="361.8" height="14" rx="3" fill="#4E79A7"/>
    <text class="value" x="669.8" y="145">3,230,421 ops/s</text>
    <text class="label" x="132" y="167">Jackson Databind Blackbird</text>
    <rect x="300" y="156" width="425.6" height="14" rx="3" fill="#F28E2B"/>
    <text class="value" x="733.6" y="167">3,800,296 ops/s</text>
    <text class="label" x="132" y="189">Serde Jackson generated</text>
    <rect x="300" y="178" width="453.3" height="14" rx="3" fill="#59A14F"/>
    <text class="value" x="761.3" y="189">4,047,710 ops/s</text>
    <text class="label" x="132" y="211">Serde Jackson runtime</text>
    <rect x="300" y="200" width="408.7" height="14" rx="3" fill="#E15759"/>
    <text class="value" x="716.7" y="211">3,649,162 ops/s</text>
    <text class="shape" x="40" y="252">Field</text>
    <text class="label" x="132" y="251">Jackson Databind</text>
    <rect x="300" y="240" width="359.5" height="14" rx="3" fill="#4E79A7"/>
    <text class="value" x="667.5" y="251">3,210,080 ops/s</text>
    <text class="label" x="132" y="273">Jackson Databind Blackbird</text>
    <rect x="300" y="262" width="362.5" height="14" rx="3" fill="#F28E2B"/>
    <text class="value" x="670.5" y="273">3,236,784 ops/s</text>
    <text class="label" x="132" y="295">Serde Jackson generated</text>
    <rect x="300" y="284" width="451.2" height="14" rx="3" fill="#59A14F"/>
    <text class="value" x="759.2" y="295">4,028,663 ops/s</text>
    <text class="label" x="132" y="317">Serde Jackson runtime</text>
    <rect x="300" y="306" width="406.4" height="14" rx="3" fill="#E15759"/>
    <text class="value" x="714.4" y="317">3,628,848 ops/s</text>
  </g>

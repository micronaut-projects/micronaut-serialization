    <text class="label" x="132" y="251">Jackson Databind</text>
    <rect x="300" y="240" width="200.8" height="14" rx="3" fill="#4E79A7"/>
    <text class="value" x="508.8" y="251">717 ns/op</text>
    <text class="label" x="132" y="273">Jackson Databind Blackbird</text>
    <rect x="300" y="262" width="204.3" height="14" rx="3" fill="#F28E2B"/>
    <text class="value" x="512.3" y="273">729 ns/op</text>
    <text class="label" x="132" y="295">Serde Jackson generated</text>
    <rect x="300" y="284" width="158.5" height="14" rx="3" fill="#59A14F"/>
    <text class="value" x="466.5" y="295">566 ns/op</text>
    <text class="label" x="132" y="317">Serde Jackson runtime</text>

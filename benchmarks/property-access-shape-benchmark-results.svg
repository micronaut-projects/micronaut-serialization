<text x="552" y="86" class="legend">Serde Jackson generated</text>
<rect x="782" y="75" width="13" height="13" fill="#E15759" rx="2"/>
<text x="802" y="86" class="legend">Serde Jackson runtime</text>
<text x="32" y="140" class="panel-title">Serialization throughput</text>
<text x="32" y="160" class="subtle">Higher is better</text>
<line x1="282.0" y1="176" x2="282.0" y2="368" class="grid"/>
<text x="282.0" y="386" class="tick" text-anchor="middle">0k</text>

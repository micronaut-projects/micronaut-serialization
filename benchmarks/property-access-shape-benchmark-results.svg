    <rect x="300" y="178" width="276.9" height="14" rx="3" fill="#59A14F"/>
    <text class="value" x="584.9" y="189">494 ns/op</text>
    <text class="label" x="132" y="211">Serde Jackson runtime</text>
    <rect x="300" y="200" width="244.1" height="14" rx="3" fill="#E15759"/>
    <text class="value" x="552.1" y="211">436 ns/op</text>
    <text class="shape" x="40" y="252">Field</text>
    <text class="label" x="132" y="251">Jackson Databind</text>
    <rect x="300" y="240" width="263.8" height="14" rx="3" fill="#4E79A7"/>
    <text class="value" x="571.8" y="251">471 ns/op</text>
    <text class="label" x="132" y="273">Jackson Databind Blackbird</text>
    <rect x="300" y="262" width="261.1" height="14" rx="3" fill="#F28E2B"/>
    <text class="value" x="569.1" y="273">466 ns/op</text>
    <text class="label" x="132" y="295">Serde Jackson generated</text>
    <rect x="300" y="284" width="240.5" height="14" rx="3" fill="#59A14F"/>
    <text class="value" x="548.5" y="295">429 ns/op</text>
    <text class="label" x="132" y="317">Serde Jackson runtime</text>
    <rect x="300" y="306" width="241.6" height="14" rx="3" fill="#E15759"/>
    <text class="value" x="549.6" y="317">431 ns/op</text>
  </g>
  <g transform="translate(0 826)">
    <text class="panel-title" x="40" y="0">Round-trip average time (ns/op, lower is better)</text>
    <line class="grid" x1="300.0" y1="18" x2="300.0" y2="326"/>
    <text class="axis" x="300.0" y="346" text-anchor="middle">0</text>
    <line class="grid" x1="580.0" y1="18" x2="580.0" y2="326"/>

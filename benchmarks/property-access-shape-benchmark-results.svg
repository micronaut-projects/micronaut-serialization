    <rect x="300" y="94" width="185.6" height="14" rx="3" fill="#E15759"/>
    <text class="value" x="493.6" y="105">331 ns/op</text>
    <text class="shape" x="40" y="146">Getter/setter</text>
    <text class="label" x="132" y="145">Jackson Databind</text>
    <rect x="300" y="134" width="197.9" height="14" rx="3" fill="#4E79A7"/>
    <text class="value" x="505.9" y="145">353 ns/op</text>
    <text class="label" x="132" y="167">Jackson Databind Blackbird</text>
    <rect x="300" y="156" width="181.5" height="14" rx="3" fill="#F28E2B"/>
    <text class="value" x="489.5" y="167">324 ns/op</text>
    <text class="label" x="132" y="189">Serde Jackson generated</text>
    <rect x="300" y="178" width="154.6" height="14" rx="3" fill="#59A14F"/>
    <text class="value" x="462.6" y="189">276 ns/op</text>
    <text class="label" x="132" y="211">Serde Jackson runtime</text>
    <rect x="300" y="200" width="160.6" height="14" rx="3" fill="#E15759"/>
    <text class="value" x="468.6" y="211">287 ns/op</text>
    <text class="shape" x="40" y="252">Field</text>
    <text class="label" x="132" y="251">Jackson Databind</text>
    <rect x="300" y="240" width="195.7" height="14" rx="3" fill="#4E79A7"/>
    <text class="value" x="503.7" y="251">349 ns/op</text>
    <text class="label" x="132" y="273">Jackson Databind Blackbird</text>
    <rect x="300" y="262" width="195.3" height="14" rx="3" fill="#F28E2B"/>
    <text class="value" x="503.3" y="273">349 ns/op</text>
    <text class="label" x="132" y="295">Serde Jackson generated</text>
    <rect x="300" y="284" width="153.7" height="14" rx="3" fill="#59A14F"/>
    <text class="value" x="461.7" y="295">274 ns/op</text>
    <text class="label" x="132" y="317">Serde Jackson runtime</text>
    <rect x="300" y="306" width="160.1" height="14" rx="3" fill="#E15759"/>
    <text class="value" x="468.1" y="317">286 ns/op</text>
  </g>
  <g transform="translate(0 826)">
    <text class="panel-title" x="40" y="0">Round-trip average time (ns/op, lower is better)</text>
    <line class="grid" x1="300.0" y1="18" x2="300.0" y2="326"/>
    <text class="axis" x="300.0" y="346" text-anchor="middle">0</text>
    <line class="grid" x1="580.0" y1="18" x2="580.0" y2="326"/>

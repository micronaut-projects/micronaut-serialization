    <text class="row-label" x="72" y="168">Jackson Databind</text>
    <rect class="jackson" x="300" y="154" width="382.6" height="16" rx="3"/>
    <text class="value" x="690.6" y="168">722</text>
    <text class="row-label" x="72" y="190">Jackson Databind Blackbird</text>
    <rect class="blackbird" x="300" y="176" width="346.9" height="16" rx="3"/>
    <text class="value" x="654.9" y="190">654</text>
    <text class="row-label" x="72" y="212">Serde generated</text>
    <rect class="serde-generated" x="300" y="198" width="298.9" height="16" rx="3"/>
    <text class="value" x="606.9" y="212">564</text>
    <text class="row-label" x="72" y="234">Serde runtime</text>
    <rect class="serde-runtime" x="300" y="220" width="316.6" height="16" rx="3"/>
    <text class="value" x="624.6" y="234">597</text>

    <text class="shape-label" x="40" y="254">Field</text>
    <text class="row-label" x="72" y="278">Jackson Databind</text>
    <rect class="jackson" x="300" y="264" width="378.1" height="16" rx="3"/>
    <text class="value" x="686.1" y="278">713</text>
    <text class="row-label" x="72" y="300">Jackson Databind Blackbird</text>
    <rect class="blackbird" x="300" y="286" width="393.5" height="16" rx="3"/>
    <text class="value" x="701.5" y="300">742</text>
    <text class="row-label" x="72" y="322">Serde generated</text>
    <rect class="serde-generated" x="300" y="308" width="295.2" height="16" rx="3"/>
    <text class="value" x="603.2" y="322">557</text>
    <text class="row-label" x="72" y="344">Serde runtime</text>

<svg xmlns="http://www.w3.org/2000/svg" width="920" height="660" viewBox="0 0 920 660" role="img" aria-labelledby="title desc">
  <title id="title">UserBeanSerdeBenchmark local results</title>
  <desc id="desc">Local JMH benchmark results comparing Jackson Databind, Jackson Databind Blackbird, Micronaut Serialization generated serdes, and Micronaut Serialization runtime serdes.</desc>
  <style>text{font-family:Inter,Arial,sans-serif;fill:#1f2933}.title{font-size:24px;font-weight:700}.panel-title{font-size:15px;font-weight:700}.label{font-size:13px}.value{font-size:12px;fill:#374151}.axis{font-size:11px;fill:#6b7280}.grid{stroke:#e5e7eb;stroke-width:1}.axis-line{stroke:#9ca3af;stroke-width:1}</style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text class="title" x="40" y="36">UserBeanSerdeBenchmark local results</text>
  <g transform="translate(0 70)">
    <text class="panel-title" x="40" y="0">Serialization throughput (ops/s, higher is better)</text>
    <line class="grid" x1="250.0" y1="18" x2="250.0" y2="142"/>
    <text class="axis" x="250.0" y="160" text-anchor="middle">0</text>
    <line class="grid" x1="530.0" y1="18" x2="530.0" y2="142"/>
    <text class="axis" x="530.0" y="160" text-anchor="middle">250,000</text>
    <line class="grid" x1="810.0" y1="18" x2="810.0" y2="142"/>
    <text class="axis" x="810.0" y="160" text-anchor="middle">500,000</text>
    <line class="axis-line" x1="250" y1="142" x2="810" y2="142"/>
    <text class="label" x="40" y="39">Jackson Databind</text>
    <rect x="250" y="26" width="332.0" height="18" rx="3" fill="#4E79A7"/>
    <text class="value" x="590.0" y="39">296,435 ops/s</text>
    <text class="label" x="40" y="69">Jackson Databind Blackbird</text>
    <rect x="250" y="56" width="332.2" height="18" rx="3" fill="#F28E2B"/>
    <text class="value" x="590.2" y="69">296,602 ops/s</text>
    <text class="label" x="40" y="99">Serde Jackson generated</text>
    <rect x="250" y="86" width="445.2" height="18" rx="3" fill="#59A14F"/>
    <text class="value" x="703.2" y="99">397,529 ops/s</text>
    <text class="label" x="40" y="129">Serde Jackson runtime</text>
    <rect x="250" y="116" width="368.1" height="18" rx="3" fill="#E15759"/>
    <text class="value" x="626.1" y="129">328,680 ops/s</text>
  </g>
  <g transform="translate(0 252)">
    <text class="panel-title" x="40" y="0">Deserialize average time (ns/op, lower is better)</text>
    <line class="grid" x1="250.0" y1="18" x2="250.0" y2="142"/>
    <text class="axis" x="250.0" y="160" text-anchor="middle">0</text>
    <line class="grid" x1="530.0" y1="18" x2="530.0" y2="142"/>
    <text class="axis" x="530.0" y="160" text-anchor="middle">2,500</text>
    <line class="grid" x1="810.0" y1="18" x2="810.0" y2="142"/>
    <text class="axis" x="810.0" y="160" text-anchor="middle">5,000</text>
    <line class="axis-line" x1="250" y1="142" x2="810" y2="142"/>
    <text class="label" x="40" y="39">Jackson Databind</text>
    <rect x="250" y="26" width="486.5" height="18" rx="3" fill="#4E79A7"/>
    <text class="value" x="744.5" y="39">4,344 ns/op</text>
    <text class="label" x="40" y="69">Jackson Databind Blackbird</text>
    <rect x="250" y="56" width="467.0" height="18" rx="3" fill="#F28E2B"/>
    <text class="value" x="725.0" y="69">4,170 ns/op</text>
    <text class="label" x="40" y="99">Serde Jackson generated</text>
    <rect x="250" y="86" width="433.7" height="18" rx="3" fill="#59A14F"/>
    <text class="value" x="691.7" y="99">3,872 ns/op</text>
    <text class="label" x="40" y="129">Serde Jackson runtime</text>
    <rect x="250" y="116" width="457.8" height="18" rx="3" fill="#E15759"/>
    <text class="value" x="715.8" y="129">4,088 ns/op</text>
  </g>
  <g transform="translate(0 434)">
    <text class="panel-title" x="40" y="0">Round-trip average time (ns/op, lower is better)</text>
    <line class="grid" x1="250.0" y1="18" x2="250.0" y2="142"/>
    <text class="axis" x="250.0" y="160" text-anchor="middle">0</text>
    <line class="grid" x1="530.0" y1="18" x2="530.0" y2="142"/>
    <text class="axis" x="530.0" y="160" text-anchor="middle">5,000</text>
    <line class="grid" x1="810.0" y1="18" x2="810.0" y2="142"/>
    <text class="axis" x="810.0" y="160" text-anchor="middle">10,000</text>
    <line class="axis-line" x1="250" y1="142" x2="810" y2="142"/>
    <text class="label" x="40" y="39">Jackson Databind</text>
    <rect x="250" y="26" width="476.1" height="18" rx="3" fill="#4E79A7"/>
    <text class="value" x="734.1" y="39">8,502 ns/op</text>
    <text class="label" x="40" y="69">Jackson Databind Blackbird</text>
    <rect x="250" y="56" width="455.7" height="18" rx="3" fill="#F28E2B"/>
    <text class="value" x="713.7" y="69">8,137 ns/op</text>
    <text class="label" x="40" y="99">Serde Jackson generated</text>
    <rect x="250" y="86" width="351.4" height="18" rx="3" fill="#59A14F"/>
    <text class="value" x="609.4" y="99">6,275 ns/op</text>
    <text class="label" x="40" y="129">Serde Jackson runtime</text>
    <rect x="250" y="116" width="389.4" height="18" rx="3" fill="#E15759"/>
    <text class="value" x="647.4" y="129">6,954 ns/op</text>
  </g>
  <text class="axis" x="40" y="632">Throughput uses ops/s; average-time results use ns/op. Longer bars are faster only in the throughput chart.</text>
</svg>
